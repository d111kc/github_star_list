<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ page.title | default: site.title }}</title>
  <meta name="description" content="{{ site.description }}">
  <link rel="icon" href="https://github.com/d111kc.png" type="image/png">
  <link rel="stylesheet" href="{{ site.baseurl }}/assets/style.css">
</head>
<body>
  {% if page.title == site.title %}
  <header>
    <h1>{{ site.title }}</h1>
    <p>{{ site.description }}</p>
  </header>
  {% endif %}
  
  <main>
    {{ content }}
  </main>
  
  <footer>
    <p>Auto-generated by <a href="https://github.com/interset-wq/github_star_list" target="_blank">GitHub Star List</a></p>
  </footer>
  
  <a href="javascript:void(0)" onclick="window.scrollTo({top:0,behavior:'smooth'})" class="back-to-top" id="backToTop">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="18 15 12 9 6 15"></polyline>
    </svg>
  </a>
  <script>
    (function() {
      var btn = document.getElementById('backToTop');
      function update() {
        var scrollY = window.pageYOffset || document.documentElement.scrollTop;
        var viewH = window.innerHeight;
        if (scrollY > 300) {
          btn.classList.add('visible');
        } else {
          btn.classList.remove('visible');
        }
        btn.style.position = 'absolute';
        btn.style.top = (scrollY + viewH - 80) + 'px';
        btn.style.right = '2rem';
      }
      window.addEventListener('scroll', update, {passive: true});
      window.addEventListener('resize', update, {passive: true});
      update();
    })();
  </script>
</body>
</html>
